<template>

    <lightning-card
        title="Eligible Jobs"
        icon-name="standard:job_profile">

        <div class="slds-p-around_medium">


            <!-- Loading -->
            <template if:true={isLoading}>

                <lightning-spinner
                    alternative-text="Loading eligible jobs...">
                </lightning-spinner>

            </template>


            <!-- Error -->
            <template if:true={hasError}>

                <div class="slds-text-color_error">

                    {errorMessage}

                </div>

            </template>


            <!-- Jobs -->
            <template if:false={isLoading}>

                <template if:true={hasJobs}>

                    <template
                        for:each={displayJobs}
                        for:item="job">

                        <c-job-card
                            key={job.Id}
                            job={job}
                            is-applied={job.isApplied}
                            is-submitting={job.isSubmitting}
                            onapply={handleApply}
                            onviewdetails={handleViewDetails}>
                        </c-job-card>

                    </template>

                </template>


                <!-- Empty -->
                <template if:false={hasJobs}>

                    <template if:false={hasError}>

                        <p>
                            No eligible jobs are currently available.
                        </p>

                    </template>

                </template>

            </template>

        </div>


        <!-- Job Details -->
        <template if:true={selectedJob}>

            <div class="slds-p-around_medium slds-border_top">

                <h2 class="slds-text-heading_medium">
                    Job Details
                </h2>

                <p>
                    <strong>Company:</strong>
                    {selectedJob.Name}
                </p>

                <p>
                    <strong>Role:</strong>
                    {selectedJob.JobRole__c}
                </p>

                <p>
                    <strong>Package:</strong>
                    {selectedJob.Package__c}
                </p>

                <p>
                    <strong>Location:</strong>
                    {selectedJob.CompanyLocation__c}
                </p>

                <p>
                    <strong>Deadline:</strong>
                    {selectedJob.LastDateToApply__c}
                </p>


                <lightning-button
                    label="Close"
                    variant="neutral"
                    class="slds-m-top_medium"
                    onclick={handleCloseDetails}>
                </lightning-button>

            </div>

        </template>

    </lightning-card>

</template>
