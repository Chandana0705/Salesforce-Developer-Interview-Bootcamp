<template>

    <div class="slds-box slds-theme_default slds-text-align_center">

        <h2 class="slds-text-heading_medium">
            {title}
        </h2>

        <p class="slds-m-top_small">
            {message}
        </p>

        <template if:true={actionLabel}>

            <lightning-button
                class="slds-m-top_medium"
                label={actionLabel}
                variant="brand"
                onclick={handleAction}>
            </lightning-button>

        </template>

    </div>

</template>
