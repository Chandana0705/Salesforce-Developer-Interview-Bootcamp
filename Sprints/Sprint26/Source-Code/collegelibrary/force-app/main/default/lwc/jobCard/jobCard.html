<template>

    <div class="slds-box slds-m-bottom_medium">

        <h2 class="slds-text-heading_medium">
            {job.Name}
        </h2>

        <p>{job.JobRole__c}</p>

        <p>
            Package: {job.Package__c}
        </p>

        <p>
            Location: {job.CompanyLocation__c}
        </p>

        <p>
            Deadline: {job.LastDateToApply__c}
        </p>


        <lightning-button
            label="View Details"
            variant="brand"
            data-id={job.Id}
            onclick={handleViewDetails}>
        </lightning-button>


        <template if:false={isApplied}>

            <lightning-button
                label={applyButtonLabel}
                variant="success"
                class="slds-m-left_small"
                onclick={handleApply}
                disabled={isSubmitting}>
            </lightning-button>

        </template>


        <template if:true={isApplied}>

            <span class="slds-text-color_success slds-m-left_small">
                ✓ APPLICATION SUBMITTED
            </span>

        </template>

    </div>

</template>
